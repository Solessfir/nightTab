name: sign-release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    environment: nightTab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm install

      - run: npm run build

      - name: Sign with AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx --yes web-ext@10.6.0 sign --source-dir=dist/web --artifacts-dir=dist/signed --channel=unlisted

      - name: Rename signed xpi
        run: |
          version=$(node -p "require('./package.json').version")
          xpi=$(ls dist/signed/*.xpi | head -n1)
          mv "$xpi" "dist/signed/nightTab-${version}.xpi"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/signed/*.xpi
